<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Project flow architecture</title>
  <desc id="desc">Simplified project architecture showing users, React frontend, Express API, PostgreSQL storage, planned Redis cache and queue, and planned product license verification flow.</desc>
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #5b677a; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .panel-soft { fill: #f8fbff; stroke: #93c5fd; stroke-width: 1.5; }
      .planned { fill: #fff8e7; stroke: #d99a22; stroke-width: 1.7; stroke-dasharray: 8 7; }
      .box-title { font: 700 17px Arial, sans-serif; fill: #172033; }
      .box-text { font: 400 13px Arial, sans-serif; fill: #3f4b5f; }
      .small { font: 700 11px Arial, sans-serif; fill: #667085; }
      .mono { font: 400 12px Consolas, Monaco, monospace; fill: #344054; }
      .badge-live { fill: #dcfce7; stroke: #86efac; }
      .badge-plan { fill: #fef3c7; stroke: #facc15; }
      .badge-text { font: 700 10px Arial, sans-serif; fill: #344054; }
      .arrow { fill: none; stroke: #2563eb; stroke-width: 3; }
      .arrow-dark { fill: none; stroke: #475569; stroke-width: 2.5; }
      .arrow-green { fill: none; stroke: #16a34a; stroke-width: 3; }
      .arrow-plan { fill: none; stroke: #b7791f; stroke-width: 2.5; stroke-dasharray: 8 7; }
      .label-bg { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
      .label { font: 700 12px Arial, sans-serif; fill: #1f2937; }
      .logo-text { font: 700 18px Arial, sans-serif; fill: #172033; }
      .logo-small { font: 400 12px Arial, sans-serif; fill: #667085; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-plan" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#b7791f"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="980"/>

  <text class="title" x="52" y="56">License Management Project Flow</text>
  <text class="subtitle" x="52" y="82">Readable architecture view: current flow in solid lines, future pieces in dashed lines.</text>

  <g id="legend">
    <rect class="panel" x="1185" y="34" width="345" height="58" rx="10"/>
    <rect class="badge-live" x="1205" y="51" width="88" height="24" rx="12"/>
    <text class="badge-text" x="1226" y="67">CURRENT</text>
    <rect class="badge-plan" x="1320" y="51" width="84" height="24" rx="12"/>
    <text class="badge-text" x="1340" y="67">PLANNED</text>
    <text class="small" x="1423" y="67">dashed borders/arrows</text>
  </g>

  <g id="users">
    <rect class="panel" x="70" y="180" width="220" height="230" rx="16"/>
    <rect class="badge-live" x="92" y="204" width="78" height="22" rx="11"/>
    <text class="badge-text" x="112" y="219">CURRENT</text>
    <text class="box-title" x="92" y="258">Users</text>
    <circle cx="132" cy="314" r="30" fill="#dbeafe" stroke="#93c5fd"/>
    <path d="M118 312c0-9 6-15 14-15s14 6 14 15-6 15-14 15-14-6-14-15z" fill="#2563eb" opacity="0.85"/>
    <path d="M104 367c7-22 24-34 48-34s41 12 48 34" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
    <text class="box-text" x="92" y="462">Admin manages data</text>
    <text class="box-text" x="92" y="484">Customer buys/renews</text>
  </g>

  <g id="frontend">
    <rect class="panel-soft" x="410" y="140" width="300" height="310" rx="16"/>
    <rect class="badge-live" x="434" y="164" width="78" height="22" rx="11"/>
    <text class="badge-text" x="454" y="179">CURRENT</text>
    <text class="box-title" x="434" y="216">Frontend</text>
    <text class="box-text" x="434" y="242">Vite + React SPA</text>

    <circle cx="477" cy="305" r="38" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <ellipse cx="477" cy="305" rx="64" ry="20" fill="none" stroke="#0284c7" stroke-width="2"/>
    <ellipse cx="477" cy="305" rx="64" ry="20" fill="none" stroke="#0284c7" stroke-width="2" transform="rotate(60 477 305)"/>
    <ellipse cx="477" cy="305" rx="64" ry="20" fill="none" stroke="#0284c7" stroke-width="2" transform="rotate(120 477 305)"/>
    <circle cx="477" cy="305" r="6" fill="#0284c7"/>

    <text class="mono" x="434" y="380">/login, /register</text>
    <text class="mono" x="434" y="402">/admin/*</text>
    <text class="mono" x="434" y="424">/portal, /portal/renew</text>
    <text class="box-text" x="434" y="464">Stores JWT in localStorage</text>
    <text class="box-text" x="434" y="486">Axios sends Bearer token</text>
  </g>

  <g id="api">
    <rect class="panel" x="840" y="140" width="330" height="310" rx="16"/>
    <rect class="badge-live" x="864" y="164" width="78" height="22" rx="11"/>
    <text class="badge-text" x="884" y="179">CURRENT</text>
    <text class="box-title" x="864" y="216">Backend API</text>
    <text class="box-text" x="864" y="242">Node.js + Express</text>

    <rect x="864" y="278" width="126" height="58" rx="10" fill="#eef6ff" stroke="#60a5fa"/>
    <text class="box-text" x="886" y="312">Auth + JWT</text>
    <rect x="1014" y="278" width="126" height="58" rx="10" fill="#effaf4" stroke="#4ade80"/>
    <text class="box-text" x="1038" y="312">RBAC</text>

    <rect x="864" y="362" width="276" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="mono" x="884" y="391">Customers / Products</text>
    <text class="mono" x="884" y="413">Licenses / Checkout / Payments</text>

    <text class="box-text" x="864" y="478">Generates signed license key</text>
    <text class="box-text" x="864" y="500">Writes history and payment rows</text>
  </g>

  <g id="postgres">
    <rect class="panel" x="1295" y="150" width="240" height="290" rx="16"/>
    <rect class="badge-live" x="1317" y="174" width="78" height="22" rx="11"/>
    <text class="badge-text" x="1337" y="189">CURRENT</text>

    <circle cx="1373" cy="258" r="48" fill="#336791"/>
    <path d="M1344 265c0-29 15-49 40-49 22 0 36 16 36 39 0 16-7 29-18 36l10 31-27-15c-7 2-14 1-21-1-13-4-20-18-20-41z" fill="#ffffff" opacity="0.95"/>
    <circle cx="1396" cy="252" r="5" fill="#336791"/>
    <path d="M1365 273c11 8 25 8 37-2" fill="none" stroke="#336791" stroke-width="3" stroke-linecap="round"/>

    <text class="logo-text" x="1324" y="346">PostgreSQL</text>
    <text class="logo-small" x="1324" y="370">Primary database</text>
    <text class="box-text" x="1324" y="402">customers, products</text>
    <text class="box-text" x="1324" y="424">licenses, payments</text>
    <text class="box-text" x="1324" y="446">license history</text>
  </g>

  <g id="redis">
    <rect class="planned" x="1295" y="530" width="240" height="260" rx="16"/>
    <rect class="badge-plan" x="1317" y="554" width="78" height="22" rx="11"/>
    <text class="badge-text" x="1337" y="569">PLANNED</text>

    <path d="M1350 638l58-28 58 28-58 28z" fill="#d82c20"/>
    <path d="M1350 670l58-28 58 28-58 28z" fill="#a91f18"/>
    <path d="M1350 702l58-28 58 28-58 28z" fill="#7f1d1d"/>
    <path d="M1368 638l40-19 40 19-40 19z" fill="#ffddd6" opacity="0.85"/>

    <text class="logo-text" x="1324" y="750">Redis</text>
    <text class="logo-small" x="1324" y="774">Future cache / queue</text>
    <text class="box-text" x="1324" y="806">sessions or rate limits</text>
    <text class="box-text" x="1324" y="828">background jobs</text>
  </g>

  <g id="planned-services">
    <rect class="planned" x="820" y="560" width="370" height="260" rx="16"/>
    <rect class="badge-plan" x="844" y="584" width="78" height="22" rx="11"/>
    <text class="badge-text" x="864" y="599">PLANNED</text>
    <text class="box-title" x="844" y="638">Future Services</text>
    <text class="box-text" x="844" y="668">License verification gateway</text>
    <text class="box-text" x="844" y="692">Entitlement engine for modules</text>
    <text class="box-text" x="844" y="716">Automation worker for renewals</text>
    <text class="box-text" x="844" y="740">Notification service</text>
    <text class="box-text" x="844" y="764">Real payment provider integration</text>
  </g>

  <g id="product-app">
    <rect class="planned" x="410" y="600" width="300" height="220" rx="16"/>
    <rect class="badge-plan" x="434" y="624" width="78" height="22" rx="11"/>
    <text class="badge-text" x="454" y="639">PLANNED</text>
    <text class="box-title" x="434" y="684">Protected Product App</text>
    <text class="box-text" x="434" y="714">Uses license key</text>
    <text class="box-text" x="434" y="738">Asks gateway/API if access is valid</text>
    <text class="box-text" x="434" y="762">Enables product modules</text>
  </g>

  <g id="current-flow-summary">
    <rect class="panel" x="70" y="850" width="1465" height="86" rx="16"/>
    <text class="box-title" x="96" y="884">Current flow</text>
    <text class="box-text" x="96" y="912">User logs in -> React stores JWT -> Axios calls Express API -> API verifies role -> PostgreSQL stores customers, products, licenses, payments, and history.</text>
    <text class="box-text" x="96" y="934">Checkout creates a signed license key, records license history, and records payment in one backend transaction.</text>
  </g>

  <g id="arrows">
    <path class="arrow" d="M290 295 C338 295 355 295 410 295" marker-end="url(#arrow-blue)"/>
    <rect class="label-bg" x="322" y="276" width="62" height="24" rx="12"/>
    <text class="label" x="338" y="292">uses</text>

    <path class="arrow" d="M710 295 C760 295 785 295 840 295" marker-end="url(#arrow-blue)"/>
    <rect class="label-bg" x="736" y="276" width="74" height="24" rx="12"/>
    <text class="label" x="751" y="292">REST</text>

    <path class="arrow-green" d="M1170 295 C1214 295 1238 295 1295 295" marker-end="url(#arrow-green)"/>
    <rect class="label-bg" x="1200" y="276" width="66" height="24" rx="12"/>
    <text class="label" x="1215" y="292">SQL</text>

    <path class="arrow-plan" d="M1170 384 C1258 430 1268 604 1295 640" marker-end="url(#arrow-plan)"/>
    <rect class="label-bg" x="1208" y="504" width="70" height="24" rx="12"/>
    <text class="label" x="1221" y="520">cache</text>

    <path class="arrow-plan" d="M710 710 C754 710 772 690 820 690" marker-end="url(#arrow-plan)"/>
    <rect class="label-bg" x="724" y="676" width="72" height="24" rx="12"/>
    <text class="label" x="738" y="692">verify</text>

    <path class="arrow-plan" d="M1005 560 C1005 510 1005 500 1005 450" marker-end="url(#arrow-plan)"/>
    <rect class="label-bg" x="1020" y="500" width="94" height="24" rx="12"/>
    <text class="label" x="1033" y="516">future API</text>

    <path class="arrow-plan" d="M1190 690 C1238 690 1248 690 1295 690" marker-end="url(#arrow-plan)"/>
    <rect class="label-bg" x="1210" y="658" width="68" height="24" rx="12"/>
    <text class="label" x="1224" y="674">queue</text>
  </g>
</svg>
